# Default values for foundryvtt-containerized.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: pgschk/foundryvtt-containerized
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Optional image digest (sha256:...), appended to the tag to pin the exact
  # build
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# foundryVTTDownloadURL specifies the timed download URL you obtained through FoundryVTT.com
foundryVTTDownloadURL: ""

# persistence contains settings regarding the data persistence
persistence:
  enabled: true
  # dataSize is the claim size for FoundryVTT data
  dataSize: 20Gi
  # installSize is the claim size for the FoundryVTT installation
  installSize: 2Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Foundry doesn't talk to the Kubernetes API, so the pod gets no token
  automount: false

podAnnotations: {}

# foundryvtt-containerized runs as user 1000. The defaults meet the
# "restricted" Pod Security Standard. fsGroup makes the volumes writable for
# that user; OnRootMismatch skips the recursive chown once they are.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The image only writes to the two volumes and /tmp (an emptyDir), so the
# root filesystem can be read-only
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: foundryvtt-containerized.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: foundryvtt-containerized-tls
  #    hosts:
  #      - foundryvtt-containerized.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# probePath is the page the startup, readiness and liveness probes request.
# With "/" (the default) the pod is also ready when the install failed (no
# or an expired download URL): the image then serves a page explaining what
# to do, and you can reach it. Set "/api/status" once your install works:
# only a running Foundry answers it, so a broken install shows as not ready
# (helm install --wait and GitOps health checks then catch it).
probePath: /

# readinessProbeTimeout is a value in seconds after which the liveness probe will time out
readinessProbeTimeout: 1

# livenessProbeTimeout is a value in seconds after which the liveness probe will time out.
# Foundry can be slow to answer while it loads a large world.
livenessProbeTimeout: 10
