apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foundryvtt-containerized.fullname" . }}
  labels:
    {{- include "foundryvtt-containerized.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "foundryvtt-containerized.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "foundryvtt-containerized.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "foundryvtt-containerized.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- if not (empty .Values.foundryVTTDownloadURL) }}
            - name: FOUNDRYVTT_DOWNLOAD_URL
              value: {{ .Values.foundryVTTDownloadURL | quote }}
          {{- end }}
          volumeMounts:
            - name: foundryvtt-data
              mountPath: /data/foundryvtt
            - name: foundryvtt-install
              mountPath: /usr/src/app/foundryvtt
            # the download lands here before it is unzipped
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The first start downloads and unzips Foundry before anything
          # listens; the startup probe gives it ten minutes. See probePath in
          # values.yaml for which page counts as ready.
          startupProbe:
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            timeoutSeconds: {{ .Values.readinessProbeTimeout | default 1 }}
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: http
            periodSeconds: 10
          livenessProbe:
            timeoutSeconds: {{ .Values.livenessProbeTimeout | default 10 }}
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: foundryvtt-data
        persistentVolumeClaim:
          claimName: {{ include "foundryvtt-containerized.fullname" . }}-data
      - name: foundryvtt-install
        persistentVolumeClaim:
          claimName: {{ include "foundryvtt-containerized.fullname" . }}-install
      # a Foundry release is about 300 MB
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
